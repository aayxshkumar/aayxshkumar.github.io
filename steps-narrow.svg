<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" width="360" height="262" role="img" aria-labelledby="t" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif" font-size="13">
<title id="t">Mixed-workload throughput by version on an Apple M4, millions of operations a second. Sequential ids: v0 21.2, v1 34.3, v2 67.5. Random-looking ids: v0 20.0, v1 30.4, v2 60.1.</title>
<style>.txt{fill:#171b20}.mut{fill:#565b62}.grid{stroke:#d5d8db}.v0{fill:#af2b25}.v1{fill:#565b62}.v2{fill:#175fa4}.o0{fill:none;stroke:#af2b25;stroke-width:1.5}.o1{fill:none;stroke:#565b62;stroke-width:1.5}.o2{fill:none;stroke:#175fa4;stroke-width:1.5}@media (prefers-color-scheme: dark){.txt{fill:#e5e8ec}.mut{fill:#a7abb1}.grid{stroke:#2f3338}.v0{fill:#f2897c}.v1{fill:#a7abb1}.v2{fill:#79b6f4}.o0{stroke:#f2897c}.o1{stroke:#a7abb1}.o2{stroke:#79b6f4}}</style>
<line class="grid" x1="12.0" y1="8" x2="12.0" y2="218"/>
<text class="mut" x="12.0" y="237" text-anchor="middle">0</text>
