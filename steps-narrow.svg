<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 268" width="360" height="268" role="img" aria-labelledby="t" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif" font-size="14">
<title id="t">Mixed-workload throughput by version on an Apple M4, millions of operations a second, median of 10 runs. Sequential ids: v0 20.9, v1 35.7, v2 65.2. Random-looking ids: v0 19.9, v1 31.2, v2 56.2.</title>
<style>.txt{fill:#171b20}.mut{fill:#565b62}.grid{stroke:#d5d8db}.v0{fill:#af2b25}.v1{fill:#565b62}.v2{fill:#175fa4}.o0{fill:none;stroke:#af2b25;stroke-width:1.5}.o1{fill:none;stroke:#565b62;stroke-width:1.5}.o2{fill:none;stroke:#175fa4;stroke-width:1.5}@media (prefers-color-scheme: dark){.txt{fill:#e5e8ec}.mut{fill:#a7abb1}.grid{stroke:#2f3338}.v0{fill:#f2897c}.v1{fill:#a7abb1}.v2{fill:#79b6f4}.o0{stroke:#f2897c}.o1{stroke:#a7abb1}.o2{stroke:#79b6f4}}</style>
<line class="grid" x1="12.0" y1="8" x2="12.0" y2="224"/>
<text class="mut" x="12.0" y="244" text-anchor="middle">0</text>
<line class="grid" x1="97.1" y1="8" x2="97.1" y2="224"/>
<text class="mut" x="97.1" y="244" text-anchor="middle">20</text>
<line class="grid" x1="182.3" y1="8" x2="182.3" y2="224"/>
<text class="mut" x="182.3" y="244" text-anchor="middle">40</text>
<line class="grid" x1="267.4" y1="8" x2="267.4" y2="224"/>
<text class="mut" x="267.4" y="244" text-anchor="middle">60</text>
<text class="mut" x="161" y="262" text-anchor="middle">M operations a second, mixed workload of 1M operations</text>
<text class="txt" x="12" y="22"><tspan font-weight="700">v0</tspan> std::map levels</text>
<rect class="v0" x="12" y="28" width="89.0" height="18"/>
