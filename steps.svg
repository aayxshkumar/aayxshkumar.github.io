<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" width="720" height="222" role="img" aria-labelledby="t" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif" font-size="15">
<title id="t">Mixed-workload throughput by version on an Apple M4, millions of operations a second. Sequential ids: v0 21.2, v1 34.3, v2 67.5. Random-looking ids: v0 20.0, v1 30.4, v2 60.1.</title>
